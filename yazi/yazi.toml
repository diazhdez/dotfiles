[mgr]
ratio = [1, 3, 4]

[opener]
edit = [
  { run = 'nvim "$@"', block = true, for = "unix" },
]
text = [
  { run = 'nvim "$@"', block = true, for = "unix" },
]
pdf = [
  { run = 'xdg-open "$@"', orphan = true, desc = "Zen Browser", for = "unix" },
]

[open]
prepend_rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/pdf", use = "pdf" },
]
