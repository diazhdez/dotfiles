[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on = "R"
run = "rename --empty=stem --cursor=start"
desc = "Rename removing the file stem"

[[mgr.prepend_keymap]]
on = [ "g", "p" ]
run = "cd ~/Pictures"
desc = "Go ~/Pictures"

[[mgr.prepend_keymap]]
on = [ "g", "s" ]
run = "cd ~/.config/scripts"
desc = "Go ~/.config/scripts"

[[mgr.prepend_keymap]]
on = [ "g", "f" ]
run = "cd ~/.config/hypr/conf"
desc = "Go to hyprland config"
